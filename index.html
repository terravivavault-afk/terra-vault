<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TerraVault by Terraviva</title>
  <meta name="description" content="TerraVault is Terraviva's digital asset library: photographs, videos, reports and learning materials for conservation, agriculture and community work in Tanzania.">
  <meta name="theme-color" content="#006E70">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="root">
    <div class="boot" role="status" aria-label="Loading TerraVault">
      <img src="assets/emblem.svg" alt="" width="96">
      <span class="boot-bar"></span>
    </div>
  </div>
  <noscript><p style="padding:2rem;font-family:sans-serif">TerraVault needs JavaScript to run. Please enable it in your browser.</p></noscript>
  <script type="module" src="js/app.js"></script>

</html>
